name: audits-corporate-draft
what_good_looks_like: >
  This draft fails on several independent axes and a good audit separates them
  rather than calling it "too corporate". It should flag "leading provider" as
  an unsubstantiated superlative needing held evidence, flag "recognised" as a
  claim with no named awarding body, flag the emoji-as-bullets pattern, flag
  the five hashtags, flag the question-as-closer being generic, and note that
  the draft survives the competitor-name swap so it says nothing. It should
  give a verdict rather than only observations, and identify this as needing
  substantive work (T3) because there is no fact in it to build on — not offer
  a word-substitution rewrite.
